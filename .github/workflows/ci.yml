name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      # Testcontainers starts Postgres and Keycloak in the runner's Docker; WireMock.Net runs in-process.
      - name: Run the tests
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Send test results to Grafana
        if: always()
        uses: gillersja1/test-results-otel@v1
        with:
          results: TestResults/results.trx
          suite: devtestlike
          otlp-endpoint: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          otlp-headers: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: TestResults
